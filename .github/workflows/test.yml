name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./...
      - name: Windows build
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -trimpath -o dist/every.exe ./cmd/every

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Unit tests
        run: go test ./...
      - name: Build script
        shell: pwsh
        run: .\build.ps1 -Output dist\every.exe
      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path dist\every.exe)) { throw "dist\every.exe was not created" }
          .\dist\every.exe version
